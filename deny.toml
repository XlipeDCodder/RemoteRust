# cargo-deny policy (blueprint v2 §7.8). Run with `cargo deny check`.

[graph]
# Check the dependency graph of both supported platforms, whatever the host.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# Vulnerabilities are always errors; unmaintained and unsound crates too.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Allow-list: anything else (GPL/AGPL/LGPL-only included) fails the check.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished (publish = false) and carry no license field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
    { crate = "bincode", reason = "unmaintained (RUSTSEC-2025-0141); use postcard" },
    { crate = "openssl-sys", reason = "TLS is rustls-only (blueprint v2 §6.1)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]
# Fuzz targets need nightly; they form their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100" # keep in sync with rust-toolchain.toml
publish = false

[workspace.dependencies]
# Internal crates (add an entry here when a crate gains its first dependent)
rr-config = { path = "crates/rr-config" }
rr-net = { path = "crates/rr-net" }
rr-platform = { path = "crates/rr-platform" }
rr-proto = { path = "crates/rr-proto" }
rr-telemetry = { path = "crates/rr-telemetry" }

# External crates (blueprint v2 §9). Keep this list short: every entry is attack surface.
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
ipnet = { version = "2", features = ["serde"] }
netdev = { version = "0.47", default-features = false }
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = "1"
# QUIC + TLS 1.3 with the `ring` provider only (no aws-lc build requirements,
# no platform verifier: peers are authenticated by pinned keys).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "zeroize"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
spake2 = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Certificate parsing: the same parser rustls itself uses.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
zeroize = "1"

[workspace.lints.rust]
# Denied everywhere; only FFI modules in rr-platform / rr-media may opt out,
# per module, with `#[allow(unsafe_code)]` (blueprint v2 §7.8).
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block must carry a `// SAFETY:` comment and do one thing only.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
# Silent truncation/sign changes are a classic source of parser bugs.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
overflow-checks = true # integer overflow must trap, never wrap silently
lto = "fat"
codegen-units = 1
panic = "abort"        # services are restarted by SCM/systemd; no half-broken state

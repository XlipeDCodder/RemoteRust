[workspace]
resolver = "3"
members = ["crates/*", "bins/*"]
# Fuzz targets need nightly; they form their own workspace.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100" # keep in sync with rust-toolchain.toml
publish = false

[workspace.dependencies]
# Internal crates (add an entry here when a crate gains its first dependent)
rr-config = { path = "crates/rr-config" }
rr-media = { path = "crates/rr-media" }
rr-net = { path = "crates/rr-net" }
rr-platform = { path = "crates/rr-platform" }
rr-proto = { path = "crates/rr-proto" }
rr-telemetry = { path = "crates/rr-telemetry" }

# External crates (blueprint v2 §9). Keep this list short: every entry is attack surface.
anyhow = "1"
# Wayland screen capture (Linux): the xdg-desktop-portal ScreenCast client
# (zbus on tokio), frames over PipeWire (blueprint v2 §3).
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screencast", "remote_desktop"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
# Viewer UI (blueprint v2 §8.6). Default features off: no clipboard access and
# no link opening (the Viewer never opens anything it receives, §7.7).
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.37", default-features = false, features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["x11", "wayland"] }
ipnet = { version = "2", features = ["serde"] }
netdev = { version = "0.47", default-features = false }
# Software H.264 (BSD-2-Clause), built from source: the fallback codec (§8.4).
openh264 = "0.9"
# PipeWire client for portal screen casts; links libpipewire-0.3 (MIT), so
# Linux builds need its headers, pkg-config and libclang.
pipewire = "0.10"
pollster = "1"
postcard = { version = "1", default-features = false, features = ["alloc"] }
proptest = "1"
# QUIC + TLS 1.3 with the `ring` provider only (no aws-lc build requirements,
# no platform verifier: peers are authenticated by pinned keys).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "zeroize"] }
ring = "0.17"
# Linux syscalls for X11 capture (memfd, mmap, poll), without libc FFI.
rustix = { version = "1.1", features = ["event", "fs", "mm"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
spake2 = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Certificate parsing: the same parser rustls itself uses.
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
# Native backends only (no WebGPU/WebGL): D3D12 on Windows, Vulkan or GL on
# Linux, Metal on macOS.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "gles", "metal"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
# Default features except Wayland title text: drawing it pulls a font parser
# (ab_glyph → ttf-parser, unmaintained: RUSTSEC-2026-0192). Windows and X11
# are unaffected; on GNOME/Wayland the title bar is drawn without its text.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
# X11 screen capture (Linux): pure-Rust protocol client with the MIT-SHM,
# DAMAGE, XFIXES and RandR extensions; no libxcb needed.
x11rb = { version = "0.13", features = ["damage", "randr", "shm", "xfixes", "xtest"] }
zeroize = "1"

[workspace.lints.rust]
# Denied everywhere; only FFI modules in rr-platform / rr-media may opt out,
# per module, with `#[allow(unsafe_code)]` (blueprint v2 §7.8).
unsafe_code = "deny"
missing_docs = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# MSVC's LNK4255 about OpenH264's same-named object files (dct.o in several
# source folders) is harmless and would otherwise show on every link.
linker_messages = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every unsafe block must carry a `// SAFETY:` comment and do one thing only.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
# Silent truncation/sign changes are a classic source of parser bugs.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.release]
overflow-checks = true # integer overflow must trap, never wrap silently
lto = "fat"
codegen-units = 1
panic = "abort"        # services are restarted by SCM/systemd; no half-broken state

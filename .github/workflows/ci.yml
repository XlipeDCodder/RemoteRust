name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt / clippy / test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup toolchain install
      # Wayland capture links libpipewire (bindgen needs libclang); Xvfb
      # runs the X11 capture tests; dbus-run-session the tray test.
      - name: Install Linux build and test packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpipewire-0.3-dev libclang-dev pkg-config xvfb dbus-daemon
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: X11 capture under Xvfb
        if: runner.os == 'Linux'
        run: >-
          xvfb-run -a -s "-screen 0 1920x1080x24"
          cargo test -p rr-platform --locked -- --ignored --test-threads=1
          --skip lists_monitors_and_captures_each
      - name: Tray (StatusNotifierItem) on a private session bus
        if: runner.os == 'Linux'
        run: dbus-run-session -- cargo test -p rr-agent --locked -- --ignored tray

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
